# Vendor AID definitions for ARC++ container runtime.
# UIDs 5000-5049 map to CrOS host UIDs 600-649 via the container uid_map,
# giving Android processes direct access to CrOS daemons (CRAS, Wayland, etc.).

[AID_VENDOR_CRAS]
value: 5000

[AID_VENDOR_WAYLAND]
value: 5001

[AID_VENDOR_ARC_BRIDGE]
value: 5002

[AID_VENDOR_ARC_CAMERA]
value: 5003

[AID_VENDOR_ARC_SENSOR]
value: 5004

[AID_VENDOR_ARC_DEBUGFS]
value: 5005

[AID_VENDOR_ARC_WLS]
value: 5006

[AID_VENDOR_AUTHPOLICY]
value: 5007

[AID_VENDOR_ARC_TRACE]
value: 5008
